services:

  caddy:
    image: caddy:2-alpine
    container_name: ignis_caddy
    restart: unless-stopped

    ports:
      - "8000:80"
      - "443:443"

    volumes:
      - ./:/var/www/html
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

    depends_on:
      - php

    networks:
      - ignis


  php:
    build:
      context: .
      dockerfile: Dockerfile

      args:
        INSTALL_XDEBUG: "true"

    container_name: ignis_php

    restart: unless-stopped

    working_dir: /var/www/html

    volumes:
      - ./:/var/www/html

    environment:

      XDEBUG_MODE: debug,develop

      XDEBUG_CONFIG: client_host=host.docker.internal client_port=9003

      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ignis
      DB_USERNAME: postgres
      DB_PASSWORD: secret

      REDIS_HOST: redis

      MAIL_HOST: mailpit
      MAIL_PORT: 1025

    depends_on:

      - postgres
      - redis
      - mailpit

    extra_hosts:

      - "host.docker.internal:host-gateway"

    networks:

      - ignis



  node:

    image: node:22-alpine

    container_name: ignis_node

    restart: unless-stopped

    working_dir: /var/www/html

    volumes:

      - ./:/var/www/html

    ports:

      - "5173:5173"

    command:

      sh -c "npm install && npm run dev -- --host 0.0.0.0"

    networks:

      - ignis



  postgres:

    image: postgres:16-alpine

    container_name: ignis_postgres

    restart: unless-stopped

    environment:

      POSTGRES_DB: ignis

      POSTGRES_USER: postgres

      POSTGRES_PASSWORD: secret

    ports:

      - "5432:5432"

    volumes:

      - postgres_data:/var/lib/postgresql/data

    networks:

      - ignis



  redis:

    image: redis:7-alpine

    container_name: ignis_redis

    restart: unless-stopped

    ports:

      - "6379:6379"

    volumes:

      - redis_data:/data

    networks:

      - ignis



  mailpit:

    image: axllent/mailpit:latest

    container_name: ignis_mailpit

    restart: unless-stopped

    ports:

      - "1025:1025"
      - "8025:8025"

    networks:

      - ignis



networks:

  ignis:

    driver: bridge



volumes:

  postgres_data:

  redis_data:

  caddy_data:

  caddy_config: