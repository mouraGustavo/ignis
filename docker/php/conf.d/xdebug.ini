; zend_extension=xdebug já é declarado por docker-php-ext-enable (docker-php-ext-xdebug.ini,
; gerado no Dockerfile) — repetir aqui causava "Cannot load Xdebug - it was already loaded".

; "debug" no modo padrão faz TODA requisição/comando artisan tentar conectar em
; xdebug.client_host:client_port antes de continuar; sem um IDE ouvindo nessa porta, cada
; conexão expira por timeout e some com vários segundos por requisição. Para depurar de fato,
; rode com XDEBUG_MODE=debug,develop (env var, sem editar este arquivo).
xdebug.mode=develop

xdebug.start_with_request=yes

xdebug.client_host=host.docker.internal

xdebug.client_port=9003
